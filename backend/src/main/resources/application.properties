spring.application.name=ai-translator-backend

server.port=8080

# Model can be changed later without rebuilding the Java code.
app.openai.model=gpt-5.4-mini

# Study Engine can use a different model later without affecting normal translation.
app.openai.study-model=${STUDY_OPENAI_MODEL:gpt-5.4-mini}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Do not place OPENAI_API_KEY in this file.
# The backend reads it from the server environment.

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# ======================================================
# MYSQL
# ======================================================
# Configure DB_USERNAME / DB_PASSWORD in IntelliJ Run Configuration.
# DB_URL is optional for local development.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ai_translator?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:ai_translator}
spring.datasource.password=${DB_PASSWORD:THanhlong211}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway owns the database schema. Hibernate only validates it.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# HikariCP pool - conservative defaults for local development.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000

# ======================================================
# JWT AUTHENTICATION
# ======================================================
# Required: configure JWT_SECRET_BASE64 in IntelliJ Run Configuration.
# It must decode to at least 32 random bytes for HS256.
app.jwt.secret-base64=${JWT_SECRET_BASE64:JgY+PmdtkscuCZ5VjBwtZLhsA0dy11uK8v42HJgtM8U=}
app.jwt.issuer=ai-translator-backend
app.jwt.access-token-minutes=15


# Opaque refresh token lifetime.
app.auth.refresh-token-days=30


# ======================================================
# PERFORMANCE / PRODUCTION NOTES
# ======================================================
# Electron uses separate client timeouts:
#   normal translate: 15 seconds
#   background study analysis: 30 seconds
#
# When deploying behind Nginx/ALB/Cloudflare, make sure the upstream
# request timeout for /api/v1/study/analyze is greater than 30 seconds.
# Do not use a 5-10 second proxy timeout for Study.
#
# PERF logs intentionally contain only timings/counts, never source text.

# Learning dashboard local day boundary
app.learning.time-zone=${LEARNING_TIME_ZONE:Asia/Ho_Chi_Minh}

management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState,ping
management.endpoint.health.group.readiness.include=readinessState,db
logging.pattern.level=%5p [requestId:%X{requestId:-}]
