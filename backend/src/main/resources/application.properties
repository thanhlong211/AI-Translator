spring.application.name=ai-translator-backend
spring.profiles.default=dev

server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ======================================================
# OPENAI / APPLICATION
# ======================================================
app.openai.model=${OPENAI_MODEL:gpt-5.4-mini}
app.openai.study-model=${STUDY_OPENAI_MODEL:gpt-5.4-mini}

# Canonical reporting currency used to resolve AI model cost snapshots.
app.ai-cost.reporting-currency=${AI_COST_REPORTING_CURRENCY:USD}
app.admin.analytics-time-zone=${ADMIN_ANALYTICS_TIME_ZONE:Asia/Ho_Chi_Minh}
app.learning.time-zone=${LEARNING_TIME_ZONE:Asia/Ho_Chi_Minh}

# Exact browser origins allowed to call /api/**. Profile-specific defaults live
# in application-dev.properties. Production must configure CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# ======================================================
# ACTUATOR / OPENAPI
# ======================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState,ping
management.endpoint.health.group.readiness.include=readinessState,db

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ======================================================
# MYSQL
# ======================================================
# Never commit DB passwords. Configure DB_USERNAME / DB_PASSWORD in the runtime
# environment. Production must also provide a TLS-enabled DB_URL.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway owns the database schema. Hibernate only validates it.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:10000}

# ======================================================
# JWT AUTHENTICATION
# ======================================================
# Required: configure JWT_SECRET_BASE64. It must decode to at least 32 random
# bytes. There is intentionally no committed fallback secret.
app.jwt.secret-base64=${JWT_SECRET_BASE64}
app.jwt.issuer=${JWT_ISSUER:ai-translator-backend}
app.jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:15}
app.auth.refresh-token-days=${REFRESH_TOKEN_DAYS:30}

# ======================================================
# HTTP / ERROR SAFETY
# ======================================================
# Keep framework-generated error pages/responses from leaking internals.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
spring.mvc.log-request-details=false

# Conservative request/upload limits. These can be raised explicitly for a
# deployment if a future server-side upload workflow needs more headroom.
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_REQUEST_SIZE:30MB}

server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,text/plain,text/css,text/javascript,application/javascript

# Request correlation logs contain only request IDs / timings / counts.
logging.pattern.level=%5p [requestId:%X{requestId:-}]

# ======================================================
# REAL SOCIAL LOGIN / IDENTITY
# ======================================================
# OAuth provider secrets stay on the backend. Desktop opens the provider in
# the system browser and never receives Google/Facebook access tokens.
#
# Local callback examples:
#   http://localhost:8080/api/v1/auth/social/google/callback
#   http://localhost:8080/api/v1/auth/social/facebook/callback
# Production must set SOCIAL_AUTH_PUBLIC_BASE_URL to the public HTTPS backend
# origin, for example https://api.example.com.
app.auth.social.public-base-url=${SOCIAL_AUTH_PUBLIC_BASE_URL:http://localhost:8080}
app.auth.social.attempt-minutes=${SOCIAL_AUTH_ATTEMPT_MINUTES:5}
app.auth.social.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
app.auth.social.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}
app.auth.social.facebook.client-id=${FACEBOOK_APP_ID:}
app.auth.social.facebook.client-secret=${FACEBOOK_APP_SECRET:}
# Optional. Set this to the Graph API version configured for your Meta app
# (for example the version shown in Meta App Dashboard). When blank, Meta's
# unversioned endpoint is used so this source file never hard-codes a stale API.
app.auth.social.facebook.graph-api-version=${FACEBOOK_GRAPH_API_VERSION:}

# ======================================================
# PASSWORD RESET
# ======================================================
app.password-reset.ttl-minutes=${PASSWORD_RESET_TTL_MINUTES:30}
app.password-reset.request-cooldown-seconds=${PASSWORD_RESET_COOLDOWN_SECONDS:60}
app.password-reset.delivery=${PASSWORD_RESET_DELIVERY:LOG}
app.password-reset.reset-url-base=${PASSWORD_RESET_URL_BASE:ai-translator://reset-password}
app.password-reset.mail-from=${PASSWORD_RESET_MAIL_FROM:no-reply@localhost}

# SMTP is used only when PASSWORD_RESET_DELIVERY=SMTP.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL_ENABLE:false}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_READ_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:5000}


# Device transfer verification
app.device-transfer.ttl-minutes=${DEVICE_TRANSFER_TTL_MINUTES:10}
app.device-transfer.request-cooldown-seconds=${DEVICE_TRANSFER_COOLDOWN_SECONDS:60}
app.device-transfer.max-attempts=${DEVICE_TRANSFER_MAX_ATTEMPTS:5}
app.device-transfer.delivery=${PASSWORD_RESET_DELIVERY:LOG}
app.device-transfer.mail-from=${PASSWORD_RESET_MAIL_FROM:no-reply@localhost}
app.device-transfer.resend-api-key=${RESEND_API_KEY:}
app.device-transfer.resend-api-url=${RESEND_API_URL:https://api.resend.com/emails}



# Lemon Squeezy payment provider
app.payment.lemonsqueezy.enabled=${LEMON_SQUEEZY_ENABLED:false}
app.payment.lemonsqueezy.api-base-url=${LEMON_SQUEEZY_API_BASE_URL:https://api.lemonsqueezy.com}
app.payment.lemonsqueezy.api-key=${LEMON_SQUEEZY_API_KEY:}
app.payment.lemonsqueezy.store-id=${LEMON_SQUEEZY_STORE_ID:}
app.payment.lemonsqueezy.webhook-secret=${LEMON_SQUEEZY_WEBHOOK_SECRET:}
