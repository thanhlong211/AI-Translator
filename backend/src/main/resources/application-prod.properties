spring.config.activate.on-profile=prod

# Production must set an exact comma-separated HTTPS allowlist.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# API documentation is not publicly exposed in production.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.swagger-ui.try-it-out-enabled=false

# Only health probes are exposed over Actuator in production.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Use this only when the application is reachable exclusively through a trusted
# reverse proxy / load balancer. Forwarded headers determine secure request
# state, which is also used for HSTS.
server.forward-headers-strategy=framework

# Fail-fast production checks. Set either override to false only for an
# intentional, isolated production-like test environment.
app.production.require-db-tls=${REQUIRE_DB_TLS:true}
app.production.require-https-cors=${REQUIRE_HTTPS_CORS:true}

server.error.whitelabel.enabled=false


# Social Login callbacks must use this public HTTPS backend origin. There is no
# localhost fallback in production. Provider credentials remain optional, but
# if configured the startup validator requires this value to be valid.
app.auth.social.public-base-url=${SOCIAL_AUTH_PUBLIC_BASE_URL:}

# Production password reset must be delivered through configured SMTP.
app.password-reset.delivery=${PASSWORD_RESET_DELIVERY:SMTP}
app.password-reset.reset-url-base=${PASSWORD_RESET_URL_BASE:}
app.password-reset.mail-from=${PASSWORD_RESET_MAIL_FROM:}

# In-process abuse guard. Keep enabled in production; use the reverse proxy as
# an additional distributed limiter when running more than one backend node.
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}

# Resend HTTPS password reset delivery
app.password-reset.resend-api-key=${RESEND_API_KEY:}
app.password-reset.resend-api-url=${RESEND_API_URL:https://api.resend.com/emails}
