spring.config.activate.on-profile=dev

# Local Admin Web origins. Override CORS_ALLOWED_ORIGINS when needed.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4174,http://127.0.0.1:4174}

# Developer convenience only. Production explicitly disables both endpoints.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.try-it-out-enabled=true

management.endpoints.web.exposure.include=health,info
server.forward-headers-strategy=none

# Local-only password reset testing. The raw reset token may be returned to the
# Desktop UI only under the dev profile.
app.password-reset.delivery=${PASSWORD_RESET_DELIVERY:LOG}
app.password-reset.dev-return-token=${PASSWORD_RESET_DEV_RETURN_TOKEN:true}

# Email verification
app.email-verification.ttl-minutes=${EMAIL_VERIFICATION_TTL_MINUTES:10}
app.email-verification.request-cooldown-seconds=${EMAIL_VERIFICATION_COOLDOWN_SECONDS:60}
app.email-verification.max-attempts=${EMAIL_VERIFICATION_MAX_ATTEMPTS:5}
app.email-verification.delivery=${PASSWORD_RESET_DELIVERY:LOG}
app.email-verification.mail-from=${PASSWORD_RESET_MAIL_FROM:no-reply@localhost}
app.email-verification.resend-api-key=${RESEND_API_KEY:}
app.email-verification.resend-api-url=${RESEND_API_URL:https://api.resend.com/emails}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ai_translator?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:ai_translator}
