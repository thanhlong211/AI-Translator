<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: transparent;
        }

        .popup {
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 16px;
            color: #202124;
            background: rgba(255, 255, 255, 0.97);
            border: 1px solid rgba(0, 0, 0, 0.12);
            border-radius: 14px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.24);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .header h1 {
            margin: 0;
            font-size: 17px;
        }

        .actions {
            display: flex;
            gap: 6px;
        }

        button {
            padding: 6px 10px;
            border: 0;
            border-radius: 7px;
            cursor: pointer;
            font-size: 13px;
        }

        #copy {
            color: white;
            background: #2563eb;
        }

        #close {
            color: #374151;
            background: #e5e7eb;
        }

        .result {
            flex: 1;
            overflow-y: auto;
        }

        .block {
            margin-bottom: 14px;
        }

        .block:last-child {
            margin-bottom: 0;
        }

        .label {
            margin-bottom: 5px;
            color: #6b7280;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .content {
            margin: 0;
            line-height: 1.55;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        #original {
            font-size: 16px;
        }


        #vietnamese {
            font-size: 15px;
            font-weight: 500;
        }

        #message {
            color: #dc2626;
        }
    </style>
</head>

<body>
    <main class="popup">
        <header class="header">
            <h1>AI Translator</h1>

            <div class="actions">
                <button id="copy">
                    Sao chép
                </button>

                <button id="close">
                    Đóng
                </button>
            </div>
        </header>

        <section class="result">
            <div id="message"></div>

            <div class="block">
                <div class="label">
                    Văn bản gốc
                </div>

                <p
                    id="original"
                    class="content"
                ></p>
            </div>


            <div class="block">
                <div class="label">
                    Tiếng Việt
                </div>

                <p
                    id="vietnamese"
                    class="content"
                ></p>
            </div>
        </section>
    </main>

    <script>
         console.log(
        "RESULT PAGE STARTED"
    );

    console.log(
        "ELECTRON API:",
        window.electronAPI
    );

    if (
        !window.electronAPI
            ?.onPopupResult
    ) {
        document.body.innerHTML = `
            <div style="
                padding: 20px;
                color: red;
                font-family: Arial;
            ">
                Không tìm thấy onPopupResult
            </div>
        `;

        throw new Error(
            "onPopupResult không tồn tại"
        );
    }
        const message =
            document.getElementById("message");

        const original =
            document.getElementById("original");


        const vietnamese =
            document.getElementById("vietnamese");

        const copyButton =
            document.getElementById("copy");

        const closeButton =
            document.getElementById("close");

        let currentResult = null;

        window.electronAPI.onPopupResult(
            (result) => {
                currentResult = result;

                if (!result.success) {
                    message.textContent =
                        result.error ||
                        "Không xử lý được kết quả.";

                    original.textContent = "";
                    vietnamese.textContent = "";

                    return;
                }

                message.textContent = "";

                original.textContent =
                    result.translation?.original ||
                    result.ocr?.text ||
                    "";

                vietnamese.textContent =
                    result.translation?.vietnamese ||
                    "";
            }
        );

        copyButton.addEventListener(
            "click",
            async () => {
                if (!currentResult?.success) {
                    return;
                }

                const text = [
                    original.textContent,
                    vietnamese.textContent
                ]
                    .filter(Boolean)
                    .join("\n\n");

                await navigator.clipboard
                    .writeText(text);

                copyButton.textContent =
                    "Đã sao chép";

                setTimeout(() => {
                    copyButton.textContent =
                        "Sao chép";
                }, 1200);
            }
        );

        closeButton.addEventListener(
            "click",
            () => {
                window.electronAPI
                    .closePopup();
            }
        );
    </script>
</body>
</html>
