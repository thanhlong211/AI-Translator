<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            cursor: crosshair;
            background: rgba(0, 0, 0, 0.35);
            user-select: none;
        }

        #box {
            position: absolute;
            display: none;
            border: 2px solid #00ff00;
            background: rgba(0, 255, 0, 0.08);
            box-sizing: border-box;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div id="box"></div>

    <script>
        let startX = 0;
        let startY = 0;

        let isSelecting = false;
        let hasSentSelection = false;

        const box =
            document.getElementById("box");

        document.addEventListener(
            "mousedown",
            (event) => {
                if (hasSentSelection) {
                    return;
                }

                startX = event.clientX;
                startY = event.clientY;

                isSelecting = true;

                box.style.display = "block";
                box.style.left = startX + "px";
                box.style.top = startY + "px";
                box.style.width = "0px";
                box.style.height = "0px";
            }
        );

        document.addEventListener(
            "mousemove",
            (event) => {
                if (
                    !isSelecting ||
                    hasSentSelection
                ) {
                    return;
                }

                const x = Math.min(
                    startX,
                    event.clientX
                );

                const y = Math.min(
                    startY,
                    event.clientY
                );

                const width = Math.abs(
                    event.clientX - startX
                );

                const height = Math.abs(
                    event.clientY - startY
                );

                box.style.left = x + "px";
                box.style.top = y + "px";
                box.style.width = width + "px";
                box.style.height = height + "px";
            }
        );

        document.addEventListener(
            "mouseup",
            (event) => {
                if (
                    !isSelecting ||
                    hasSentSelection
                ) {
                    return;
                }

                isSelecting = false;

                const data = {
                    x: Math.min(
                        startX,
                        event.clientX
                    ),

                    y: Math.min(
                        startY,
                        event.clientY
                    ),

                    width: Math.abs(
                        event.clientX - startX
                    ),

                    height: Math.abs(
                        event.clientY - startY
                    )
                };

                if (
                    data.width < 5 ||
                    data.height < 5
                ) {
                    box.style.display =
                        "none";

                    return;
                }

                if (
                    !window.electronAPI
                        ?.sendSelection
                ) {
                    console.error(
                        "sendSelection không tồn tại"
                    );

                    return;
                }

                hasSentSelection = true;

                console.log(
                    "SELECTED:",
                    data
                );

                window.electronAPI
                    .sendSelection(data);
            }
        );
    </script>
</body>
</html>
