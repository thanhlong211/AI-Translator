<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: Arial, sans-serif;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
            width: 100%;
            height: 100%;
        }

        button {
            display: grid;
            place-items: center;
            width: 29px;
            height: 24px;
            padding: 0;
            border: 1px solid rgba(0,0,0,.13);
            border-radius: 8px;
            cursor: pointer;
            color: #4b5563;
            background: rgba(255,255,255,.88);
            box-shadow: 0 2px 7px rgba(0,0,0,.13);
            font-size: 12px;
            opacity: .72;
            transition:
                opacity 120ms ease,
                transform 120ms ease;
        }

        button:hover {
            opacity: 1;
            transform: translateY(-1px);
        }

        #pin.active {
            color: #ffffff;
            background: #6d5bd0;
            border-color: #6d5bd0;
        }

        #close:hover {
            color: #ffffff;
            background: #b42318;
            border-color: #b42318;
        }
    </style>
</head>

<body>
    <div class="controls">
        <button
            id="pin"
            title="Ghim overlay"
        >
            📌
        </button>

        <button
            id="close"
            title="Đóng bản dịch"
        >
            ×
        </button>
    </div>

    <script>
        const pin =
            document.getElementById(
                "pin"
            );

        const close =
            document.getElementById(
                "close"
            );

        function render(state) {
            const pinned =
                Boolean(
                    state?.pinned
                );

            pin.classList.toggle(
                "active",
                pinned
            );

            pin.title =
                pinned
                    ? "Bỏ ghim overlay"
                    : "Ghim overlay";
        }

        window.electronAPI
            ?.getTranslationOverlayState?.()
            .then(render)
            .catch(() => {});

        window.electronAPI
            ?.onTranslationOverlayState?.(
                render
            );

        pin.addEventListener(
            "click",
            async () => {
                const state =
                    await window
                        .electronAPI
                        .toggleTranslationOverlayPin();

                render(state);
            }
        );

        close.addEventListener(
            "click",
            () => {
                window
                    .electronAPI
                    .closeTranslationOverlay();
            }
        );
    </script>
</body>
</html>
