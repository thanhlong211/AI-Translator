<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: "Segoe UI", Arial, sans-serif;
      pointer-events: none;
    }

    .hud {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px 14px;
      color: #111827;
      background: rgba(255, 255, 255, .96);
      border: 1px solid rgba(17, 24, 39, .14);
      border-radius: 14px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, .18);
      backdrop-filter: blur(8px);
    }

    .spinner {
      width: 24px;
      height: 24px;
      flex: 0 0 auto;
      border: 3px solid rgba(37, 99, 235, .18);
      border-top-color: #2563eb;
      border-radius: 999px;
      animation: spin .72s linear infinite;
    }

    .copy {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    #message {
      overflow: hidden;
      color: #111827;
      font-size: 13px;
      font-weight: 750;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #detail {
      overflow: hidden;
      color: #6b7280;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="spinner"></div>
    <div class="copy">
      <div id="message">Đang xử lý…</div>
      <div id="detail">AI Translator</div>
    </div>
  </div>

  <script>
    const message = document.getElementById("message");
    const detail = document.getElementById("detail");

    window.setTranslationLoadingState = (state) => {
      message.textContent = String(state?.message || "Đang xử lý…");
      detail.textContent = String(state?.detail || "AI Translator");
    };
  </script>
</body>
</html>
