<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            pointer-events: none;
            font-family:
                Arial,
                sans-serif;
        }

        :root {
            --overlay-opacity: 0.96;
        }

        #translation {
            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 12px;

            color: #111;

            background:
                rgba(
                    255,
                    255,
                    255,
                    var(--overlay-opacity)
                );

            border: 1px solid
                rgba(0, 0, 0, 0.12);

            border-radius: 45%;

            text-align: center;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            word-break: break-word;

            font-weight: 700;
            line-height: 1.3;

            box-shadow:
                0 3px 14px
                rgba(0, 0, 0, 0.2);
        }
    </style>
</head>

<body>
    <div id="translation"></div>

    <script>
        const translation =
            document.getElementById(
                "translation"
            );

        let overlayPreferences = {
            opacity: 0.96,
            fontScale: 1
        };

        function applyPreferences(
            next
        ) {
            const opacity =
                Number(
                    next?.opacity
                );

            const fontScale =
                Number(
                    next?.fontScale
                );

            overlayPreferences = {
                opacity:
                    Number.isFinite(
                        opacity
                    )
                        ? Math.min(
                            1,
                            Math.max(
                                0.65,
                                opacity
                            )
                        )
                        : 0.96,

                fontScale:
                    Number.isFinite(
                        fontScale
                    )
                        ? Math.min(
                            1.4,
                            Math.max(
                                0.8,
                                fontScale
                            )
                        )
                        : 1
            };

            document
                .documentElement
                .style
                .setProperty(
                    "--overlay-opacity",
                    String(
                        overlayPreferences.opacity
                    )
                );

            requestAnimationFrame(
                () => {
                    fitText(
                        translation
                    );
                }
            );
        }

        function fitText(element) {
            const text =
                element.textContent || "";

            if (!text) {
                return;
            }

            /*
             * Ước lượng font ban đầu theo
             * diện tích vùng chọn và độ dài chữ.
             */
            const area =
                element.clientWidth *
                element.clientHeight;

            let fontSize =
                Math.floor(
                    Math.sqrt(
                        area /
                        Math.max(
                            text.length,
                            1
                        )
                    ) *
                    0.85 *
                    overlayPreferences.fontScale
                );

            fontSize = Math.max(
                12,
                Math.min(
                    40,
                    fontSize
                )
            );

            element.style.fontSize =
                fontSize + "px";

            /*
             * Giảm font cho đến khi
             * nội dung nằm hoàn toàn trong box.
             */
            while (
                (
                    element.scrollHeight >
                    element.clientHeight
                    ||
                    element.scrollWidth >
                    element.clientWidth
                )
                &&
                fontSize > 10
            ) {
                fontSize -= 1;

                element.style.fontSize =
                    fontSize + "px";
            }
        }

        window.electronAPI
            .onTranslationOverlayPreferences?.(
                (preferences) => {
                    applyPreferences(
                        preferences
                    );
                }
            );

        window.electronAPI
            .onSelectionTranslation(
                (data) => {
                    translation.textContent =
                        data.text || "";

                    /*
                     * Bubble ngang thường phù hợp
                     * với bo góc vừa phải.
                     * Bubble dọc thì bo tròn hơn.
                     */
                    const vertical =
                        data.height >
                        data.width * 1.25;

                    translation.style
                        .borderRadius =
                            vertical
                                ? "45%"
                                : "18px";

                    requestAnimationFrame(
                        () => {
                            fitText(
                                translation
                            );
                        }
                    );
                }
            );
    </script>
</body>
</html>
