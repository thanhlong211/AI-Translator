appId: com.dangt.aitranslator
productName: AI Translator

asar: true
compression: normal
npmRebuild: true
buildDependenciesFromSource: false

# Keep release artifacts outside dist/ so Vite and Electron packaging do not mix.
directories:
  output: release
  buildResources: electron/assets

# The renderer is built by Vite into dist/. Electron main/preload and overlay HTML
# remain under electron/. Production node_modules are resolved from package.json by
# electron-builder and are not copied from this files list manually.
files:
  - dist/**/*
  - electron/**/*
  - package.json
  - "!electron/**/*.md"
  - "!electron/**/*.map"

# Native/spawned packages must live outside app.asar at runtime. electron-builder
# also auto-detects native modules, but these explicit patterns make the Windows
# desktop contract deterministic for sharp and screenshot-desktop.
asarUnpack:
  - node_modules/sharp/**/*
  - node_modules/@img/**/*
  - node_modules/screenshot-desktop/**/*

# OcrWorkerManager resolves packaged OCR at process.resourcesPath/ocr.
# Only the production runtime is copied; .venv, worker.py, build cache and model
# download cache are intentionally excluded.
extraResources:
  - from: ocr/runtime
    to: ocr/runtime
    filter:
      - "**/*"
  - from: .release-config/release-config.json
    to: config/release-config.json
  - from: electron/assets/tray.png
    to: assets/tray.png

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: electron/assets/icon.ico
  executableName: AI Translator
  requestedExecutionLevel: asInvoker

# Batch 15.1.3 - Windows installer. Use the assisted NSIS flow so the user can
# review the destination and installation scope. Per-user is selected by default.
# User data is intentionally preserved during uninstall/upgrade.
nsis:
  oneClick: false
  perMachine: false
  selectPerMachineByDefault: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AI Translator
  runAfterFinish: true
  artifactName: "AI-Translator-Setup-${version}-${arch}.${ext}"
